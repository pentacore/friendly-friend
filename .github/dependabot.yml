# Weekly dependency updates. Every ecosystem waits 5 days after a release
# before proposing it, so a broken or compromised release has time to be
# pulled first (security updates don't wait). Minor and patch updates are
# grouped per ecosystem and dependency type; majors arrive one by one.
#
# Commit prefixes drive releases (.releaserc.json): chore(deps) cuts a patch
# release, chore(deps-dev) and ci(deps) none.
#
# Hold an update with an `ignore` entry whose comment names the upstream
# issue that lifts it, and list it in ROADMAP.md (.ai/rules/dependencies.md).

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 5
    groups:
      composer-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      composer-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 5
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # vite-plus, the `vite` alias in devDependencies and the `vite` override
      # in package.json must name the same Vite+ release, and Dependabot only
      # bumps one of them. Bump all three together by hand.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      # vue-tsc runs the classic compiler API (`typescript/lib/tsc`), which
      # TypeScript 7 no longer ships (vuejs/language-tools#6167). Lift once
      # vue-tsc or its successor checks .vue files on TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
