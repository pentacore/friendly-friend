name: release

# After `ci` passes on a push to main: semantic-release reads the conventional
# commits since the last tag and picks the next version (feat → minor, fix and
# chore(deps) → patch, BREAKING CHANGE → major; docs, test, ci and other chores
# → no release). It writes CHANGELOG.md, commits it as `chore(release): X.Y.Z`,
# tags `vX.Y.Z` and publishes a GitHub release. The image job then builds that
# tag and pushes it to GHCR. The image is the same for every deploy: browsers
# read where Reverb is from the page at runtime, so nothing site-specific is
# compiled in. It lives in this workflow because a tag pushed
# with GITHUB_TOKEN never triggers another workflow.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}

    steps:
      # The branch tip, not workflow_run.head_sha: when another commit landed
      # meanwhile, semantic-release refuses to release from behind the remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # semantic-release 26 needs Node 26.13+, newer than the app's Node, so it
      # runs pinned through npx instead of from package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          npx --yes \
            -p semantic-release@26.0.1 \
            -p @semantic-release/changelog@7.0.0 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@10.4.1 \
            semantic-release
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ] && [ "$tag" != "$before" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Build and push image
    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.published == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
