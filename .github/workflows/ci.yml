name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql, redis, pcntl, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Typefinder drift check (committed types must be current)
        run: php artisan typefinder:generate --check --strict

      - name: Lint (Rector, Pint)
        run: composer lint:check

      - name: Static analysis (Larastan max)
        run: composer types:check

      - name: Build frontend (generates Wayfinder routes)
        run: npm run build

      - name: Frontend lint and format
        run: npm run check

      - name: Frontend type check
        run: npm run types:check

      - name: Tests (Pest)
        run: php artisan test --parallel

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (light + dark, Pest + Playwright)
        run: php artisan test --testsuite=Browser

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --target app -t friendly-friend:ci .

      - name: Smoke test PHP version
        run: docker run --rm --entrypoint php friendly-friend:ci -v

  docs-updated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Warn when code changes without rules/docs changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-docs-updated.sh "origin/$BASE_REF"
