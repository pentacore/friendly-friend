# Production stack for the home server. See docs/deployment.md.
#   docker compose -f compose.prod.yaml up -d --build

# Shared by every app container (same image, different command).
x-base: &base
    image: friendly-friend:latest
    build:
        context: .
        # Compiled into the frontend: the public WebSocket endpoint browsers use.
        args:
            VITE_APP_NAME: '${APP_NAME:-Friendly Friend}'
            VITE_REVERB_APP_KEY: '${REVERB_APP_KEY:?set REVERB_APP_KEY in .env}'
            VITE_REVERB_HOST: '${VITE_REVERB_HOST:?set VITE_REVERB_HOST (public host) in .env}'
            VITE_REVERB_PORT: '${VITE_REVERB_PORT:-443}'
            VITE_REVERB_SCHEME: '${VITE_REVERB_SCHEME:-https}'
    env_file: .env
    environment:
        # Logs go to `docker compose logs`, not to a file inside the container.
        LOG_CHANNEL: stderr
    volumes:
        - storage:/app/storage/app

# Long-running app services start only after migrations succeeded.
x-app: &app
    <<: *base
    restart: unless-stopped
    depends_on:
        migrate:
            condition: service_completed_successfully
        postgres:
            condition: service_healthy
        redis:
            condition: service_started

services:
    migrate:
        <<: *base
        command: ['php', 'artisan', 'migrate', '--force']
        restart: 'no'
        healthcheck:
            disable: true
        depends_on:
            postgres:
                condition: service_healthy

    web:
        <<: *app
        ports:
            - '${WEB_PORT:-80}:80'
        # The base image's check polls Caddy's admin API, which php-server
        # disables; check Laravel's health route instead.
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost/up']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    horizon:
        <<: *app
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'horizon']
        stop_signal: SIGTERM

    scheduler:
        <<: *app
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'schedule:work']

    reverb:
        <<: *app
        healthcheck:
            disable: true
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${REVERB_PUBLIC_PORT:-8080}:8080'

    bot:
        <<: *app
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'bot:run']
        stop_signal: SIGTERM

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-U',
                    '${DB_USERNAME}',
                    '-d',
                    '${DB_DATABASE}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:alpine
        restart: unless-stopped
        volumes:
            - redis:/data

volumes:
    storage:
    postgres:
    redis:
