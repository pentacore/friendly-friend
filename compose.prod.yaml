# Production stack for the home server. See docs/deployment.md.
#   docker compose -f compose.prod.yaml up -d --build

x-app: &app
    build: .
    image: friendly-friend:latest
    env_file: .env
    restart: unless-stopped
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_started
    volumes:
        - storage:/app/storage/app

services:
    web:
        <<: *app
        environment:
            RUN_MIGRATIONS: 'true'
        ports:
            - '${WEB_PORT:-80}:80'

    horizon:
        <<: *app
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'horizon']
        stop_signal: SIGTERM

    scheduler:
        <<: *app
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'schedule:work']

    reverb:
        <<: *app
        healthcheck:
            disable: true
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${REVERB_PUBLIC_PORT:-8080}:8080'

    bot:
        <<: *app
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'bot:run']
        stop_signal: SIGTERM

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-U',
                    '${DB_USERNAME}',
                    '-d',
                    '${DB_DATABASE}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:alpine
        restart: unless-stopped
        volumes:
            - redis:/data

volumes:
    storage:
    postgres:
    redis:
